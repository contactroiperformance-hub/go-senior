<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>html,body{overflow-x:hidden;max-width:100%}
img{max-width:100%;height:auto}
body{margin:0;font-family:'Libre Franklin',system-ui,sans-serif}a{color:#2E5B4C}a:hover{color:#1F4237}</style>
</helmet>
<form onSubmit="{{ go }}" style="background:#FFFFFF;border:1px solid #E5DFD2;border-radius:16px;padding:24px;box-shadow:0 1px 2px rgba(34,50,43,0.06),0 12px 32px rgba(34,50,43,0.08);display:flex;flex-direction:column;gap:16px;font-family:'Libre Franklin',system-ui,sans-serif">
  <sc-if value="{{ showTitle }}" hint-placeholder-val="{{ true }}">
    <span style="font-weight:600;font-size:19.5px;color:#22322B">{{ title }}</span>
  </sc-if>
  <div style="display:flex;flex-wrap:wrap;gap:14px">
    <label style="flex:2;min-width:220px;display:flex;flex-direction:column;gap:7px">
      <span style="font-size:17px;font-weight:600;color:#22322B">Votre projet</span>
      <select value="{{ projet }}" onChange="{{ setProjet }}" style="height:58px;border:1.5px solid #C9C2B2;border-radius:10px;padding:0 14px;font-family:'Libre Franklin',system-ui,sans-serif;font-size:19px;color:#22322B;background:#FFFFFF;cursor:pointer">
        <option value="" disabled>Choisissez votre projet</option>
        <option value="monte-escalier">Monte-escalier</option>
        <option value="baignoire-douche">Remplacement baignoire par douche</option>
        <option value="douche-senior">Douche senior</option>
        <option value="salle-de-bain">Salle de bain adaptée</option>
      </select>
    </label>
    <label style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px">
      <span style="font-size:17px;font-weight:600;color:#22322B">Votre code postal</span>
      <input type="text" inputMode="numeric" maxLength="5" placeholder="ex. {{ cpExemple }}" value="{{ cp }}" onChange="{{ setCp }}" style="height:58px;border:1.5px solid #C9C2B2;border-radius:10px;padding:0 14px;font-family:'Libre Franklin',system-ui,sans-serif;font-size:19px;color:#22322B;box-sizing:border-box">
    </label>
  </div>
  <button type="submit" style="height:58px;background:#C05A2E;color:#FFFFFF;border:none;border-radius:10px;font-family:'Libre Franklin',system-ui,sans-serif;font-weight:600;font-size:19.5px;cursor:pointer" style-hover="background:#A84D24">{{ cta }}</button>
  <span style="font-size:16.5px;color:#5A685F;text-align:center">Demande gratuite et sans engagement. La disponibilité dépend du projet et du secteur.</span>
</form>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:330},&quot;projet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;monte-escalier&quot;,&quot;baignoire-douche&quot;,&quot;douche-senior&quot;,&quot;salle-de-bain&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vérifiez les solutions dans votre secteur&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Voir les solutions disponibles&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;},&quot;cpExemple&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;59000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;,&quot;description&quot;:&quot;Exemple de code postal du placeholder — alimenté dynamiquement par la localité&quot;},&quot;ville&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;,&quot;description&quot;:&quot;Nom de la ville transmis au formulaire (pages locales)&quot;}}">
class Component extends DCLogic {
  state = { cp: "", projet: null };
  renderVals() {
    const projet = this.state.projet ?? this.props.projet ?? "";
    return {
      cp: this.state.cp,
      projet,
      cpExemple: this.props.cpExemple ?? "59000",
      title: this.props.title ?? "Vérifiez les solutions dans votre secteur",
      showTitle: (this.props.title ?? "x") !== "",
      cta: this.props.cta ?? "Voir les solutions disponibles",
      setCp: e => this.setState({ cp: e.target.value.replace(/[^0-9]/g, "").slice(0, 5) }),
      setProjet: e => this.setState({ projet: e.target.value }),
      go: e => {
        e.preventDefault();
        const q = new URLSearchParams();
        if (projet) q.set("projet", projet);
        if (this.state.cp) q.set("cp", this.state.cp);
        if (this.props.ville) q.set("ville", this.props.ville);
        location.href = "Formulaire.dc.html" + (q.toString() ? "?" + q.toString() : "");
      }
    };
  }
}
</script>
</body>
</html>
